

trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:

- task: Docker@2
  inputs:
    containerRegistry: 'dotnetmssqlrm555217'
    repository: 'dotnetsql'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latesttrigger:
- master

pool:
  vmImage: ubuntu-latest

steps:

# 🏗️ Etapa 1 — Build & Push da imagem
- task: Docker@2
  displayName: 'Build e Push da imagem Docker'
  inputs:
    containerRegistry: 'dotnetmssqlrm555217'
    repository: 'dotnetsql'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)
      latest

# 🚀 Etapa 2 — Deploy no Azure Container Instances
- task: AzureCLI@2
  displayName: 'Deploy no Azure Container Instance'
  inputs:
    azureSubscription: '<NOME-DA-SERVICE-CONNECTION>'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      RESOURCE_GROUP="rg-azuredevops-docker"
      CONTAINER_NAME="dotnetmssqlrm555217"
      ACR_NAME="dotnetmssqlrm555217"
      IMAGE_NAME="dotnetsql:latest"

      echo "🧹 Deletando container antigo (se existir)..."
      az container delete --name $CONTAINER_NAME --resource-group $RESOURCE_GROUP --yes || true

      echo "⏳ Aguardando exclusão completa..."
      while az container show --name $CONTAINER_NAME --resource-group $RESOURCE_GROUP &> /dev/null; do
        echo "Aguardando o container ser removido..."
        sleep 10
      done

      echo "🚀 Criando novo container..."
      az container create \
        --resource-group $RESOURCE_GROUP \
        --name $CONTAINER_NAME \
        --image $ACR_NAME.azurecr.io/$IMAGE_NAME \
        --cpu 1 \
        --memory 1 \
        --os-type Linux \
        --registry-login-server $ACR_NAME.azurecr.io \
        --registry-username $(az acr credential show --name $ACR_NAME --query "username" -o tsv) \
        --registry-password $(az acr credential show --name $ACR_NAME --query "passwords[0].value" -o tsv) \
        --dns-name-label $CONTAINER_NAME \
        --restart-policy Always \
        --ports 80
