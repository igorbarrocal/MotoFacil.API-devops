trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  containerRegistry: 'dotnetmssqlrm555217.azurecr.io'
  repository: 'dotnetsql'

steps:
- task: Docker@2
  displayName: 'Build and Push Docker image'
  inputs:
    containerRegistry: 'dotnetmssqlrm555217'
    repository: '$(repository)'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      latest

- task: AzureWebAppContainer@1
  displayName: 'Deploy to Azure App Service (container)'
  inputs:
    azureSubscription: 'Igor Dias Barrocal (52f5586a-47ef-42ba-a49d-095f99384cff)'
    appName: 'acrwebapprm555217'
    containers: '$(containerRegistry)/$(repository):latest'